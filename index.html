<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPE IL SOTTERRANEO</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400&family=DotGothic16&family=Bebas+Neue&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg-list: #fafafa;
  --bg-modal: #ffffff;
  --surface: #f2f2f2;
  --border: #e0e0e0;
  --dim: #cccccc;
  --text: #1a1a1a;
  --text-dim: #888888;
  --text-bright: #000000;
  --green: #000000;
  --green-dim: #e8e8e8;
  --amber: #000000;
  --red: #cc0000;
  --blue: #555555;
  --cursor-color: #000000;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
  cursor: crosshair;
}





/* ── BOOT HEADER ── */
#boot {
  border-bottom: 2px solid var(--green);
  padding: 2.2rem 2rem 1.4rem;
  position: relative;
  overflow: hidden;
}

/* 背景噪訊橫條 */
#boot::before { display: none; }

/* 左側工業鉚釘線 */
#boot::after { display: none; }

/* 主標題區 */
.boot-title-block {
  margin-bottom: 1.4rem;
  padding-left: 0.5rem;
  position: relative;
}

.boot-eyebrow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: #888888;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeIn 0.2s 0.05s forwards;
  margin-bottom: 0.3rem;
}

.boot-main-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3rem, 10vw, 6rem);
  letter-spacing: 0.06em;
  line-height: 0.9;
  color: var(--text-bright);
  position: relative;
  display: inline-block;
  opacity: 0;
  animation: titleIn 0.3s 0.15s cubic-bezier(0.2,0,0,1) forwards;
  /* 雙重錯位陰影：工業印刷感 */
  text-shadow:
    2px 2px 0 rgba(0,0,0,0.08);
}

/* 隨機閃爍的 glitch 效果 */
.boot-main-title::before {
  content: 'PEPE IL SOTTERRANEO';
  position: absolute;
  left: 3px; top: 0;
  color: #555555;
  opacity: 0;
  clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
  animation: glitch 6s 2s step-end infinite;
}
.boot-main-title::after {
  content: 'PEPE IL SOTTERRANEO';
  position: absolute;
  left: -2px; top: 0;
  color: #cc0000;
  opacity: 0;
  clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
  animation: glitch 6s 2.08s step-end infinite;
}

@keyframes titleIn {
  from { opacity:0; transform: translateX(-8px) skewX(-1deg); }
  to   { opacity:1; transform: translateX(0) skewX(0); }
}

@keyframes glitch {
  0%, 92%, 100% { opacity:0; transform: none; }
  93%  { opacity:0.7; transform: translateX(4px); }
  94%  { opacity:0; }
  96%  { opacity:0.5; transform: translateX(-3px); }
  97%  { opacity:0; }
}

.boot-subtitle {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-top: 0.4rem;
  opacity: 0;
  animation: fadeIn 0.2s 0.4s forwards;
  border-left: 2px solid #000000;
  padding-left: 0.7rem;
}

/* 分隔橫條 */
.boot-divider {
  height: 1px;
  background: linear-gradient(90deg, #000000 0%, transparent 70%);
  margin: 1rem 0 1rem;
  opacity: 0;
  animation: fadeIn 0.2s 0.5s forwards;
}

/* 格言 */
.boot-motto {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1rem, 3vw, 1.35rem);
  letter-spacing: 0.12em;
  color: #aaaaaa;
  opacity: 0;
  animation: fadeIn 0.4s 0.65s forwards;
  padding-left: 0.5rem;
}
.boot-motto-tr {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6em;
  letter-spacing: 0.08em;
  color: #bbbbbb;
  vertical-align: middle;
}

/* boot log 那幾行維持原樣 */
.boot-line {
  opacity: 0;
  animation: fadeIn 0.1s forwards;
}
.boot-line:nth-child(1)  { animation-delay: 0.6s; }
.boot-line:nth-child(2)  { animation-delay: 0.8s; }
.boot-line:nth-child(3)  { animation-delay: 1.0s; }
.boot-line:nth-child(4)  { animation-delay: 1.2s; }

@keyframes fadeIn { to { opacity:1; } }

.sys  { color: var(--text-dim); }
.ok   { color: var(--green); }
.warn { color: var(--amber); }
.hi   { color: var(--text-bright); font-size: 1.6em; letter-spacing: 0.15em; }
.cursor {
  display: inline-block;
  width: 8px; height: 1em;
  background: #000000;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity:0; } }

/* ── FILTER / COMMAND LINE ── */
#cmdline {
  padding: 0.6rem 0;
  border-bottom: 2px solid #000000;
  position: sticky;
  top: 0;
  background: #ffffff;
  border-top: 1px solid #e0e0e0;
  z-index: 50;
}

.prompt { color: var(--green); user-select: none; }

.cmd-btn {
  background: none;
  border: 1px solid #cccccc;
  color: #888888;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  padding: 0.2rem 0.7rem;
  cursor: pointer;
  transition: all 0.1s;
  letter-spacing: 0.05em;
}
.cmd-btn:hover {
  border-color: #000000;
  color: #000000;
}
.cmd-btn.active {
  border-color: #000000;
  color: #ffffff;
  background: #000000;
}



/* ── ENTRY LIST ── */
#entries {
  padding: 1.5rem 2rem 3rem;
  columns: 3 280px;
  column-gap: 1.2rem;
}

.entry {
  border: 1.5px solid #e0e0e0;
  padding: 1.2rem 1.4rem 1rem;
  display: block;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  opacity: 0;
  animation: rowIn 0.2s forwards;
  background: var(--bg-list);
  break-inside: avoid;
  margin-bottom: 1.2rem;
}

.entry:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  border-color: #aaaaaa;
}
.entry:nth-child(even) { background: var(--bg); }
.entry:hover .entry-id { color: #000000; }
.entry:hover::before {
  content: '▶';
  position: absolute;
  left: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--amber);
  font-size: 10px;
}

@keyframes rowIn {
  from { opacity:0; transform: translateX(-6px); }
  to   { opacity:1; transform: translateX(0); }
}

.entry:nth-child(1)  { animation-delay: 0.05s; }
.entry:nth-child(2)  { animation-delay: 0.1s; }
.entry:nth-child(3)  { animation-delay: 0.15s; }
.entry:nth-child(4)  { animation-delay: 0.2s; }

.entry-id {
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 0.05em;
  float: right;
  margin-left: 0.5rem;
}

.entry-main {}

.entry-title {
  color: var(--text-bright);
  font-size: 14px;
  letter-spacing: 0.05em;
  margin-bottom: 0.15rem;
}

.entry-sub {
  color: var(--text-dim);
  font-size: 11px;
  margin-bottom: 0.4rem;
}

.entry-tags {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.tag {
  font-size: 10px;
  padding: 0 0.4rem;
  border: 1px solid;
  letter-spacing: 0.08em;
}
.tag-recipe  { color: #000000; border-color: #000000; }
.tag-know    { color: #555555; border-color: #aaaaaa; }
.tag-tech    { color: #000000; border-color: #000000; background: #000000; color: #ffffff; }
.tag-cuisine { color: #888888; border-color: #cccccc; }

.entry-meta {
  color: var(--text-dim);
  font-size: 10px;
  text-align: right;
  margin-top: 0.8rem;
  white-space: nowrap;
  display: block;
}

/* ── MODAL / RECORD VIEW ── */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  overflow-y: auto;
  padding: 2rem;
}
#overlay.open { display: block; }

#record {
  max-width: 760px;
  margin: 0 auto;
  border: 2px solid #000000;
  background: var(--bg-modal);
  position: relative;
  animation: open 0.15s ease;
}
@keyframes open {
  from { opacity:0; transform: scale(0.98); }
  to   { opacity:1; transform: scale(1); }
}

.rec-header {
  background: #000000;
  color: #ffffff;
  padding: 0.6rem 1.2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.1em;
}

.rec-close {
  background: none; border: none;
  color: #ffffff;
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  cursor: pointer; font-weight: bold;
  letter-spacing: 0;
  line-height: 1;
}

.rec-body { padding: 1.5rem 1.5rem 2rem; }

.rec-title {
  color: var(--text-bright);
  font-size: 1.4em;
  letter-spacing: 0.08em;
  margin-bottom: 0.2rem;
}
.rec-sub {
  color: var(--text-dim);
  font-size: 11px;
  margin-bottom: 1rem;
}
.rec-tags { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom: 1.5rem; }

.rec-section {
  margin-bottom: 1.8rem;
}

.rec-section-label {
  color: #000000;
  font-size: 10px;
  letter-spacing: 0.2em;
  border-bottom: 1px solid var(--green-dim);
  padding-bottom: 0.3rem;
  margin-bottom: 0.9rem;
}

.rec-text {
  color: var(--text);
  font-size: 12px;
  line-height: 1.9;
  white-space: pre-wrap;
}

/* ingredients table */
.ing-group-label {
  color: var(--amber);
  font-size: 10px;
  letter-spacing: 0.15em;
  margin: 0.8rem 0 0.3rem;
}
.ing-group-label:first-child { margin-top: 0; }

.ing-row {
  display: flex;
  gap: 1rem;
  padding: 0.2rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.ing-row:hover { background: var(--surface); }
.ing-name { color: var(--text); flex:1; }
.ing-amt  { color: var(--text-dim); white-space: nowrap; }

/* steps */
.step-row {
  display: grid;
  grid-template-columns: 2rem 1fr;
  gap: 0.8rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  align-items: start;
}
.step-n {
  color: #000000;
  font-size: 16px;
  line-height: 1.4;
  text-align: right;
}
.step-body {}
.step-title { color: var(--amber); font-size: 10px; letter-spacing: 0.1em; margin-bottom: 0.2rem; }
.step-text  { color: var(--text); line-height: 1.8; }

/* tip */
.tip {
  border: 1px solid #000000;
  padding: 0.8rem 1rem;
  margin-top: 0.5rem;
  font-size: 12px;
  color: var(--text);
  line-height: 1.8;
  position: relative;
}
.tip::before {
  content: '// NOTE';
  color: #000000; opacity: 0.6;
  font-size: 10px;
  letter-spacing: 0.1em;
  display: block;
  margin-bottom: 0.4rem;
}

/* knowledge */
.know-item {
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--border);
}
.know-key {
  color: #000000; opacity: 1;
  font-size: 11px;
  letter-spacing: 0.1em;
  margin-bottom: 0.3rem;
}
.know-val {
  color: var(--text);
  font-size: 12px;
  line-height: 1.9;
  white-space: pre-wrap;
}

/* ── FOOTER ── */
footer {
  border-top: 2px solid #000000;
  padding: 1rem 2rem;
  color: #888888;
  background: #ffffff;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
}

/* hide when filtered out */
.entry.hidden { display: none; }

/* ── MOBILE RWD (≤480px) ── */
@media (max-width: 480px) {

  /* header 縮排 */
  #boot {
    padding: 1.5rem 1.2rem 1rem;
  }
  .boot-main-title {
    font-size: clamp(2.2rem, 12vw, 3.2rem);
  }
  .boot-subtitle {
    font-size: 9px;
    letter-spacing: 0.2em;
  }
  .boot-motto {
    font-size: 0.95rem;
  }
  .boot-motto-tr {
    display: block;
    margin-top: 0.15rem;
    font-size: 0.7em;
  }

  /* filter bar 橫向滾動，不換行 */
  #cmdline {
    padding: 0.6rem 1rem;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    gap: 0.5rem;
    scrollbar-width: none;
  }
  #cmdline::-webkit-scrollbar { display: none; }
  
  
  .cmd-btn {
    flex-shrink: 0;
    font-size: 11px;
    padding: 0.25rem 0.65rem;
  }

  /* 手機單欄 */
  #entries {
    padding: 1rem;
    columns: 1;
  }
  .entry { margin-bottom: 0.9rem; }
  .entry-title { font-size: 13px; }
  .entry-sub   { font-size: 10px; }

  /* modal 全螢幕感 */
  #overlay { padding: 0.8rem; }
  #record { border-radius: 0; }
  .rec-body { padding: 1.2rem 1.2rem 1.8rem; }
  .rec-title { font-size: 1.15em; }

  /* ingredient grid 單欄 */
  .ingredient-grid,
  .ing-row { font-size: 12px; }

  /* step */
  .step-row { gap: 0.6rem; }
  .step-n { font-size: 13px; width: 1.4rem; }

  /* footer */
  footer { padding: 0.8rem 1.2rem; font-size: 10px; }
}

/* 知識類卡片稍微寬一點（靠 span 模擬） */
.entry[data-tags*="節氣"],
.entry[data-tags*="食材知識"] {
  border-left: 3px solid #000000;
}
.entry[data-tags*="料理技巧"] {
  border-top: 3px solid #000000;
}
.entry[data-tags*="食譜"] {
  border-color: #d0d0d0;
}

/* ── FILTER GROUPS ── */
#cmdline {
  display: flex;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  row-gap: 0.5rem;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0 1rem;
  flex-wrap: wrap;
}
.filter-group:first-child { padding-left: 2rem; }
.filter-group:last-child  { padding-right: 2rem; }

.filter-group-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #bbbbbb;
  text-transform: uppercase;
  margin-right: 0.2rem;
  white-space: nowrap;
}

.filter-divider {
  width: 1px;
  height: 1.4rem;
  background: #e0e0e0;
  flex-shrink: 0;
}

@media (max-width: 480px) {
  .filter-group { padding: 0 0.5rem; }
  .filter-group:first-child { padding-left: 1rem; }
  .filter-divider { display: none; }
  .filter-group-label { display: none; }
}
</style>
</head>

      steps: [

        { t:"燉煮", b:"加入洋蔥、南瓜、鷹嘴豆翻炒均勻，倒入椰子鮮奶油和水，小火燉 20 分鐘至南瓜軟透。" },

  {
    id: "002",
    title: "椰香鷹嘴豆咖哩",
    sub: "Chana Masala 變體 — 新手友善版",

    date: "2026.06",
    content: {

      intro: "第一次做印度咖哩的入門選擇。椰子鮮奶油不只增加風味，下鍋後溫度立刻降低，大幅降低香料炒焦的風險。",

// tag styling
function tagClass(t) {
  if (["食譜"].includes(t)) return "tag-recipe";
  if (["食材知識"].includes(t)) return "tag-know";
  if (["料理技巧"].includes(t)) return "tag-tech";
  return "tag-cuisine";
}
function tagHTML(t) {
  return `<span class="tag ${tagClass(t)}">${t}</span>`;
}

// render list
function render(filter) {
  const container = document.getElementById('entries');
  const knowledgeTags = ["節氣","食材知識","料理技巧"];
  const isKnowledge = r => r.tags.some(t => knowledgeTags.includes(t));

  let filtered = DB.filter(r => filter === 'all' || r.tags.includes(filter));
  // 知識類排前面
  filtered = [
    ...filtered.filter(r => isKnowledge(r)),
    ...filtered.filter(r => !isKnowledge(r))
  ];

  let html = '';
  let count = filtered.length;
  filtered.forEach((r, i) => {
    html += `
    <div class="entry" data-id="${r.id}" data-tags="${r.tags.join(',')}" style="animation-delay:${i*0.04}s">
      <div class="entry-id">${r.id}</div>
      <div class="entry-main">
        <div class="entry-title">${r.title}</div>
        <div class="entry-sub">${r.sub}</div>
        <div class="entry-tags">${r.tags.map(tagHTML).join('')}</div>
      </div>
      <div class="entry-meta">${r.date}</div>
    </div>`;
  });
  if (count === 0) html = `<div style="padding:3rem 2rem;color:var(--text-dim);">// nessun risultato per: ${filter}</div>`;
  container.innerHTML = html;

  container.querySelectorAll('.entry').forEach(el => {
    el.addEventListener('click', () => openRecord(el.dataset.id));
  });
}

// open record
function openRecord(id) {
  const r = DB.find(x => x.id === id);
  const c = r.content;
  document.getElementById('rec-header-text').textContent = `RECORD ${r.id} — ${r.title}`;

  let html = `
    <div class="rec-tags">${r.tags.map(tagHTML).join('')}</div>
    <div class="rec-title">${r.title}</div>
    <div class="rec-sub">${r.sub}</div>
  `;

  if (c.type === 'recipe') {
    html += `<div class="rec-section">
      <div class="rec-section-label">// DESCRIPTION</div>
      <div class="rec-text">${c.intro}</div>
    </div>`;

    html += `<div class="rec-section"><div class="rec-section-label">// INGREDIENTS</div>`;
    c.ingredients.forEach(g => {
      html += `<div class="ing-group-label">${g.group}</div>`;
      g.items.forEach(([n,a]) => {
        html += `<div class="ing-row"><span class="ing-name">${n}</span><span class="ing-amt">${a}</span></div>`;
      });
    });
    html += `</div>`;

    html += `<div class="rec-section"><div class="rec-section-label">// STEPS</div>`;
    c.steps.forEach((s,i) => {
      html += `<div class="step-row">
        <div class="step-n">${String(i+1).padStart(2,'0')}</div>
        <div class="step-body">
          <div class="step-title">${s.t}</div>
          <div class="step-text">${s.b}</div>
        </div>
      </div>`;
    });
    html += `</div>`;

    if (c.tip) html += `<div class="rec-section"><div class="tip">${c.tip}</div></div>`;

  } else {
    html += `<div class="rec-section"><div class="rec-section-label">// NOTES</div>`;
    c.items.forEach(item => {
      html += `<div class="know-item">
        <div class="know-key">${item.k}</div>
        <div class="know-val">${item.v}</div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('recBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRecord() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn').addEventListener('click', closeRecord);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeRecord();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRecord(); });

document.querySelectorAll('.cmd-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

document.getElementById('footer-date').textContent = new Date().toISOString().split('T')[0];

render('all');
</script>
</body>
</html>
