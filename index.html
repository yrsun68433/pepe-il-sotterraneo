@media (max-width: 480px) {

function tagClass(t) {
  if (["食譜"].includes(t)) return "tag-recipe";
  if (["食材知識"].includes(t)) return "tag-know";
  if (["料理技巧"].includes(t)) return "tag-tech";
  return "tag-cuisine";
}
const tagDisplay = {
  "台式": "臺灣", "日式": "日本",
};
function tagHTML(t) {
  const label = tagDisplay[t] || t;
  return `<span class="tag ${tagClass(t)}">${label}</span>`;
}

function render(filter) {
  const container = document.getElementById('entries');
  const knowledgeTags = ["節氣","食材知識","料理技巧"];
  const isKnowledge = r => r.tags.some(t => knowledgeTags.includes(t));
  let filtered = DB.filter(r => filter === 'all' || r.tags.includes(filter));
  filtered = [...filtered.filter(r => isKnowledge(r)), ...filtered.filter(r => !isKnowledge(r))];
  let html = '';
  if (filtered.length === 0) {
    html = `<div style="padding:3rem 2rem;color:var(--text-dim);">// nessun risultato per: ${filter}</div>`;
  } else {
    filtered.forEach((r, i) => {
      html += `<div class="entry" data-id="${r.id}" data-tags="${r.tags.join(',')}" style="animation-delay:${i*0.04}s">
        <div class="entry-id">${r.id}</div>
        <div class="entry-main">
          <div class="entry-title">${r.title}</div>
          <div class="entry-sub">${r.sub}</div>
          <div class="entry-tags">${r.tags.map(tagHTML).join('')}</div>
        </div>
        <div class="entry-meta">${r.date}</div>
      </div>`;
    });
  }
  container.innerHTML = html;
  container.querySelectorAll('.entry').forEach(el => {
    el.addEventListener('click', () => openRecord(el.dataset.id));
  });
}

function openRecord(id) {
  const r = DB.find(x => x.id === id);
  const c = r.content;
  document.getElementById('rec-header-text').textContent = `RECORD ${r.id} — ${r.title}`;
  let html = `<div class="rec-tags">${r.tags.map(tagHTML).join('')}</div>
    <div class="rec-title">${r.title}</div>
    <div class="rec-sub">${r.sub}</div>`;
  if (c.type === 'recipe') {
    html += `<div class="rec-section"><div class="rec-section-label">// DESCRIPTION</div><div class="rec-text">${c.intro}</div></div>`;
    html += `<div class="rec-section"><div class="rec-section-label">// INGREDIENTS</div>`;
    c.ingredients.forEach(g => {
      html += `<div class="ing-group-label">${g.group}</div>`;
      g.items.forEach(([n,a]) => {
        html += `<div class="ing-row"><span class="ing-name">${n}</span><span class="ing-amt">${a}</span></div>`;
      });
    });
    html += `</div>`;
    html += `<div class="rec-section"><div class="rec-section-label">// STEPS</div>`;
    c.steps.forEach((s,i) => {
      html += `<div class="step-row"><div class="step-n">${String(i+1).padStart(2,'0')}</div>
        <div class="step-body"><div class="step-title">${s.t}</div><div class="step-text">${s.b}</div></div></div>`;
    });
    html += `</div>`;
    if (c.tip) html += `<div class="rec-section"><div class="tip">${c.tip}</div></div>`;
  } else {
    html += `<div class="rec-section"><div class="rec-section-label">// NOTES</div>`;
    c.items.forEach(item => {
      html += `<div class="know-item"><div class="know-key">${item.k}</div><div class="know-val">${item.v}</div></div>`;
    });
    html += `</div>`;
  }
  document.getElementById('recBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRecord() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn').addEventListener('click', closeRecord);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeRecord();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRecord(); });
document.querySelectorAll('.cmd-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
document.getElementById('footer-date').textContent = new Date().toISOString().split('T')[0];
render('all');
</script>
